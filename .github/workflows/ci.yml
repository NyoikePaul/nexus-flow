name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type-check (NestJS API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Install build tools
        run: npm install @nestjs/cli @nestjs/schematics prisma@5 @prisma/client@5 --save-dev

      - name: Generate Prisma client
        run: npx prisma@5 generate

      - name: Build
        run: ./node_modules/.bin/nest build --tsc

      - name: Done
        run: echo "✅ NestJS API build passed"
