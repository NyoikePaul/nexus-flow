name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type-check (NestJS API)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: apps/api
        run: npm install --legacy-peer-deps

      - name: Install build tools
        working-directory: apps/api
        run: npm install @nestjs/cli @nestjs/schematics prisma@5 @prisma/client@5 --save-dev

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma@5 generate --schema ./prisma/schema.prisma

      - name: Build
        working-directory: apps/api
        run: ./node_modules/.bin/nest build --tsc

      - name: Done
        run: echo "✅ NestJS API build passed"
